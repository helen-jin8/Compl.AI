# Device attribute to standard mapping.
#
# This file is the deterministic core of the analyst. The model classifies the
# device and picks attributes. This table decides the standards. Keep it that way
# so the output is auditable and a judge can read it.
#
# Every entry carries a citation the recipient can look up themselves. Never emit
# a standard without one.
#
# Accuracy note that must survive into the product: this table is a scoping aid.
# The binding scope comes from the accredited lab. Anything we send says so.

disclaimer: >
  Scoping guidance only. Certification authority rests with an accredited NRTL
  for product safety and an FCC-recognised TCB for equipment authorization. This
  scope is confirmed or corrected by lab quotes before any client relies on it.

attributes:

  intentional_radiator:
    label: Contains a transmitter (Bluetooth, Wi-Fi, LoRa, cellular, NFC at power)
    standards:
      - id: 47 CFR Part 15 Subpart C
        name: Intentional radiators
        cite: 47 CFR 15.247 for 2.4 GHz digital transmission systems, 15.407 for U-NII bands
        note: Requires certification through an FCC-recognised TCB. Self-declaration is not available.
      - id: FCC KDB 447498
        name: RF exposure, SAR or MPE evaluation
        cite: FCC KDB 447498 D01, general RF exposure guidance
        note: Portable devices used within 20 cm generally need SAR. Beyond 20 cm, MPE.
    typical_weeks: 4
    typical_cost_usd: [4000, 12000]

  unintentional_radiator:
    label: Digital electronics with a clock above 9 kHz and no transmitter
    standards:
      - id: 47 CFR Part 15 Subpart B
        name: Unintentional radiators
        cite: 47 CFR 15.107 conducted limits, 15.109 radiated limits
        note: Class B applies to residential. Supplier Declaration of Conformity path, testing still required.
    typical_weeks: 2
    typical_cost_usd: [1500, 5000]

  mains_or_usb_powered_electronics:
    label: Audio, video, IT or communications equipment
    standards:
      - id: UL 62368-1
        name: Audio/video, information and communication technology equipment, safety
        cite: UL 62368-1 3rd edition, harmonised with IEC 62368-1
        note: Superseded UL 60950-1 and UL 60065. Assume 62368-1 for anything new.
    typical_weeks: 8
    typical_cost_usd: [8000, 25000]

  lithium_cell:
    label: Contains lithium-ion or lithium-polymer cells
    standards:
      - id: UL 1642
        name: Lithium batteries, cell level
        cite: UL 1642
        note: Usually already held by the cell vendor. Ask for their certificate before paying to repeat it.
      - id: UL 2054
        name: Household and commercial batteries, pack level
        cite: UL 2054
        note: Pack level is normally the client's responsibility even when cells are certified.
      - id: IEC 62133-2
        name: Secondary lithium cells and batteries, safety
        cite: IEC 62133-2:2017
        note: The international counterpart. Needed for most markets outside the US.
      - id: UN 38.3
        name: Transport of dangerous goods, lithium battery testing
        cite: UN Manual of Tests and Criteria, Part III, sub-section 38.3
        note: Not optional. No carrier will move the product by air without it. This is the deadline most campaigns miss.
    typical_weeks: 6
    typical_cost_usd: [3000, 9000]

  external_power_supply:
    label: Ships with a wall adapter or external power supply
    standards:
      - id: DOE Level VI
        name: External power supply efficiency
        cite: 10 CFR Part 430 Subpart B Appendix Z
        note: Buy a pre-certified adapter. Certifying your own is rarely worth it at low volume.
      - id: UL 62368-1
        name: Safety, adapter scope
        cite: UL 62368-1
        note: Usually covered by the adapter vendor's existing listing.
    typical_weeks: 1
    typical_cost_usd: [0, 2000]

  sold_to_children:
    label: Intended for users under 12
    standards:
      - id: CPSIA
        name: Consumer Product Safety Improvement Act
        cite: 15 U.S.C. 2051 et seq, lead and phthalate limits
        note: Requires a Children's Product Certificate based on third party testing. Hard deadline, commonly missed.
      - id: ASTM F963
        name: Standard consumer safety specification for toy safety
        cite: ASTM F963-23
    typical_weeks: 4
    typical_cost_usd: [2000, 8000]

  light_emitting:
    label: LED lighting or luminaire
    standards:
      - id: UL 8750
        name: Light emitting diode equipment for use in lighting products
        cite: UL 8750
      - id: UL 1993
        name: Self-ballasted lamps and lamp adapters
        cite: UL 1993
        note: Applies when the product is a replacement lamp rather than a fixture.
    typical_weeks: 6
    typical_cost_usd: [4000, 12000]

  micromobility:
    label: E-bike, e-scooter or personal mobility device
    standards:
      - id: UL 2849
        name: Electrical systems for e-bikes
        cite: UL 2849
        note: New York City Local Law 39 makes this effectively mandatory for sale in NYC. Check current state law before quoting.
      - id: UL 2272
        name: Electrical systems for personal e-mobility devices
        cite: UL 2272
      - id: UL 2271
        name: Batteries for use in light electric vehicle applications
        cite: UL 2271
    typical_weeks: 10
    typical_cost_usd: [12000, 35000]

  wireless_power:
    label: Inductive or resonant wireless charging
    standards:
      - id: 47 CFR Part 18
        name: Industrial, scientific and medical equipment
        cite: 47 CFR Part 18
        note: Wireless power transfer often falls under Part 18 rather than Part 15. Getting this wrong is a common and expensive mistake.
    typical_weeks: 4
    typical_cost_usd: [4000, 10000]

  medical_claim:
    label: Makes a diagnostic or therapeutic claim
    standards:
      - id: IEC 60601-1
        name: Medical electrical equipment, general safety
        cite: IEC 60601-1 3.2 edition
      - id: FDA pathway
        name: Device classification and premarket pathway
        cite: 21 CFR Parts 862 to 892
        note: OUT OF SCOPE. Flag and refer out. Do not quote this. Wellness claims and medical claims are separated by wording, and the wording is the whole question.
    out_of_scope: true

market_extensions:

  european_union:
    trigger: Ships to the EU or UK
    standards:
      - id: RED 2014/53/EU
        name: Radio Equipment Directive
        cite: EN 300 328 for 2.4 GHz, EN 301 489 for EMC
      - id: EN 62368-1
        name: Safety, EU harmonised
      - id: RoHS 2011/65/EU
        name: Restriction of hazardous substances
      - id: WEEE 2012/19/EU
        name: Waste electrical and electronic equipment
        note: Requires a registered producer in each member state. Catches every crowdfunding campaign that promised EU shipping.

  canada:
    trigger: Ships to Canada
    standards:
      - id: ISED RSS-247
        name: Digital transmission systems, frequency hopping and licence-exempt
      - id: CAN/CSA-C22.2 No. 62368-1
        name: Safety, Canadian national difference
